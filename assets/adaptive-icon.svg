<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Transparent background for adaptive icon -->
  <rect width="1024" height="1024" fill="none"/>
  
  <!-- Scale icon -->
  <g transform="translate(212, 212) scale(0.6)">
    <!-- Scale platform -->
    <rect x="200" y="550" width="600" height="30" rx="15" fill="#39FF14"/>
    
    <!-- Scale left column -->
    <rect x="300" y="580" width="30" height="120" rx="5" fill="#444444"/>
    
    <!-- Scale right column -->
    <rect x="670" y="580" width="30" height="120" rx="5" fill="#444444"/>
    
    <!-- Weight display -->
    <rect x="250" y="400" width="500" height="120" rx="20" fill="#0F0F0F" stroke="#39FF14" stroke-width="10"/>
    
    <!-- Weight text -->
    <text x="500" y="480" font-family="Arial" font-size="80" font-weight="bold" fill="#39FF14" text-anchor="middle">75.5</text>
    
    <!-- Weight unit -->
    <text x="650" y="480" font-family="Arial" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="middle">kg</text>
  </g>
</svg>
